apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: jerney

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: sudarshan1109/jerney-backend:latest

          ports:
            - containerPort: 5000

          env:
            - name: DB_USER
              value: jerney

            - name: DB_PASSWORD
              value: jerney123

            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: jerney

            - name: PORT
              value: "5000"
