apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: jerney

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: sudarshan1109/jerney-frontend:latest

          ports:
            - containerPort: 80
