services:

  postgres:
    image: postgres:16-alpine
    container_name: jerney-postgres

    environment:
      POSTGRES_DB: jerney_db
      POSTGRES_USER: jerney_user
      POSTGRES_PASSWORD: JerneyLocal@123

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jerney_user -d jerney_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
    image: jerney-backend:1.0
    container_name: jerney-backend

    environment:
      DB_USER: jerney_user
      DB_PASSWORD: JerneyLocal@123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jerney_db
      PORT: 5000

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
    image: jerney-frontend:1.0
    container_name: jerney-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:
  postgres_data:
